<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">Industrial RAG Evidence Research Agent architecture</title>
  <desc id="desc">A local PDF and research task pass through the Streamlit workspace, PyMuPDF loader, KnowledgeBaseSession and existing retrieval, bounded Evidence Research Agent, and host-side evidence reference validation. The workspace renders observed actions, source references, and a Markdown report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24364b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8da3"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #132238; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #607186; }
      .head { font: 650 18px 'Segoe UI', Arial, sans-serif; fill: #18304c; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #596c82; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; letter-spacing: .08em; fill: #52708d; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #52667d; }
    </style>
  </defs>
  <rect width="1440" height="610" rx="24" fill="url(#bg)"/>
  <text x="64" y="72" class="title">Industrial RAG Evidence Research Agent</text>
  <text x="64" y="104" class="subtitle">Local, single-document workflow · bounded actions · host-rendered provenance</text>

  <g filter="url(#shadow)">
    <rect x="64" y="190" width="188" height="174" rx="18" fill="#ffffff" stroke="#dbe5ef"/>
    <rect x="288" y="190" width="188" height="174" rx="18" fill="#ffffff" stroke="#dbe5ef"/>
    <rect x="512" y="190" width="204" height="174" rx="18" fill="#ffffff" stroke="#dbe5ef"/>
    <rect x="752" y="190" width="236" height="174" rx="18" fill="#ffffff" stroke="#dbe5ef"/>
    <rect x="1024" y="190" width="190" height="174" rx="18" fill="#ffffff" stroke="#dbe5ef"/>
    <rect x="1250" y="190" width="126" height="174" rx="18" fill="#eaf2fb" stroke="#c9d9ea"/>
  </g>

  <path d="M252 277 H278" stroke="#7a8da3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M476 277 H502" stroke="#7a8da3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M716 277 H742" stroke="#7a8da3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M988 277 H1014" stroke="#7a8da3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1214 277 H1240" stroke="#7a8da3" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <text x="84" y="222" class="small">INPUT</text>
    <text x="84" y="258" class="head">PDF + task</text>
    <text x="84" y="291" class="body">One local document</text>
    <text x="84" y="315" class="body">Explicit research scope</text>

    <text x="308" y="222" class="small">PARSING</text>
    <text x="308" y="258" class="head">PyMuPDF loader</text>
    <text x="308" y="291" class="body">Page text and source</text>
    <text x="308" y="315" class="body">provenance</text>

    <text x="532" y="222" class="small">RETRIEVAL</text>
    <text x="532" y="258" class="head">KnowledgeBase</text>
    <text x="532" y="280" class="head">Session</text>
    <text x="532" y="315" class="body">Existing search and</text>
    <text x="532" y="337" class="body">evidence lookup tools</text>

    <text x="772" y="222" class="small">BOUNDED AGENT</text>
    <text x="772" y="258" class="head">Evidence Research Agent</text>
    <text x="772" y="291" class="body">SEARCH → LOOKUP</text>
    <text x="772" y="315" class="body">CLARIFY → FINISH</text>

    <text x="1044" y="222" class="small">HOST VALIDATION</text>
    <text x="1044" y="258" class="head">Evidence references</text>
    <text x="1044" y="291" class="body">Resolve IDs and render</text>
    <text x="1044" y="315" class="body">source / page / block</text>

    <text x="1266" y="222" class="small">OUTPUT</text>
    <text x="1266" y="258" class="head">Report</text>
    <text x="1266" y="291" class="body">+ workspace</text>
    <text x="1266" y="315" class="body">Markdown</text>
  </g>

  <path d="M1313 365 V442 H1170" fill="none" stroke="#a7b8c9" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M306 442 H44 V277 H54" fill="none" stroke="#a7b8c9" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <rect x="306" y="414" width="852" height="58" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
  <text x="338" y="449" class="head">Streamlit workspace</text>
  <text x="540" y="449" class="note">collects the PDF and task, then displays observed trace, validated references, and report</text>
  <text x="64" y="548" class="note">A citation identifies source location. It does not establish relevance, completeness, or engineering correctness.</text>
</svg>
