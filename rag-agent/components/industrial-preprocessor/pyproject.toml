[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-preprocessor"
version = "0.1.0"
description = "Industrial agent document preprocessing pipeline"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.24,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]
